<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java Web Calculator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            margin-top: 50px; 
            background-color: #121214; 
            color: #ffffff;
        }
        .calc-box { 
            padding: 24px; 
            border-radius: 24px; 
            background: #1a1a1e; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 300px; 
            text-align: center; 
        }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            box-sizing: border-box; 
            border-radius: 12px; 
            border: 1px solid #2d2d34; 
            background-color: #2d2d34;
            color: white;
            font-size: 16px;
        }
        input {
            background-color: #26262b;
            border: none;
        }
        button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.15s ease;
        }
        button:hover { background-color: #0056b3; }
        #result { 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 20px; 
            color: #30d158; 
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="calc-box">
        <h2>Java Calculator</h2>
        <input type="number" id="num1" placeholder="First Number">
        <select id="operator">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
        </select>
        <input type="number" id="num2" placeholder="Second Number">
        <button onclick="performCalculation()">Calculate</button>
        <div id="result"></div>
    </div>

    <script>
        async function performCalculation() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const operator = document.getElementById('operator').value;
            const resultDiv = document.getElementById('result');

            if(!num1 || !num2) {
                resultDiv.style.color = "#ff453a";
                resultDiv.innerText = "Please enter both numbers.";
                return;
            }

            try {
                const response = await fetch(`/calculate?num1=${num1}&num2=${num2}&operator=${operator}`);
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.style.color = "#ff453a";
                    resultDiv.innerText = data.error;
                } else {
                    resultDiv.style.color = "#30d158";
                    resultDiv.innerText = `Result: ${data.result}`;
                }
            } catch (err) {
                resultDiv.style.color = "#ff453a";
                resultDiv.innerText = "Error contacting Java server.";
            }
        }
    </script>
</body>
</html>
